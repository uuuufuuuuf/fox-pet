# Builds the Windows installer on GitHub and has SignPath sign it (free for open source via the
# SignPath Foundation). Smart App Control blocks unsigned code, so both the app's own files (exe,
# dll inside the installed folder) and the installer itself are signed:
#   1. build the app folder   2. sign its exe / dll   3. build the installer from the signed folder
#   4. sign the installer      5. attach it to a GitHub release
# Runs when a tag like v1.0.0 is pushed (or by hand from the Actions tab).
#
# Needs, from your SignPath project (see SIGNING.md):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 1. the app folder (dist/win-unpacked), unsigned
      - run: npx electron-builder --win --dir --publish never

      - id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: dist/win-unpacked/

      # 2. sign every exe / dll in it
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fox-pet
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/app-signed

      # 3. the installer, packed from the signed folder
      - run: npx electron-builder --win nsis --prepackaged dist/app-signed --publish never

      - id: installer-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/FoxPet-Setup-*.exe

      # 4. sign the installer
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fox-pet
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      # 5. publish
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/signed/*.exe
